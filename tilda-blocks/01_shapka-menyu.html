/* Phone/CTA swap wrapper */
.bimpro-nav-action-wrap {
  position: relative;
  width: 280px;
  height: 50px;
  overflow: hidden;
  display: flex;

.bimpro-nav-phone {

  position: absolute;
  right: 0;
  top: 50%;

  white-space: nowrap;
}
.bimpro-nav-phone:hover { color: #d13a12 !important; }
.bimpro-nav-phone.is-hidden {
  opacity: 0;
  transform: translateY(calc(-50% + 50px));
  pointer-events: none;
}
.bimpro-nav-cta {
  font-family: 'BebasNeueCustom', sans-serif;
  font-size: 18px;
  color: #fff !important;
  text-decoration: none;
  letter-spacing: 0.05em;
  background: #e64317;
  padding: 9px 20px 7px;
  border-radius: 4px;
  transition: background 0.2s, opacity 0.5s, transform 0.5s;
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(calc(-50% - 50px));
  opacity: 0;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(230,67,23,0.4);
  pointer-events: none;
}
.bimpro-nav-cta:hover { background: #d13a12 !important; color: #fff !important; }
.bimpro-nav-cta.is-visible {
  opacity: 1;
  transform: translateY(-50%);
  pointer-events: auto;
}

/* Mobile hamburger button */
.bimpro-nav-hamburger {

  gap: 5px;
  cursor: pointer;
  padding: 4px;
  background: none;
  border: none;
  outline: none;
}
.bimpro-nav-hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: #fff;
  border-radius: 2px;
  transition: all 0.3s;
}
.bimpro-nav-hamburger.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.bimpro-nav-hamburger.is-open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.bimpro-nav-hamburger.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Mobile dropdown menu */
.bimpro-nav-mobile {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, opacity 0.3s;
  opacity: 0;
  background: rgba(27, 27, 27, 0.98);
  border-top: 1px solid transparent;
}
.bimpro-nav-mobile.is-open {
  max-height: 600px;
  opacity: 1;
  border-top-color: rgba(207,206,206,0.1);
}
.bimpro-nav-mobile-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;

  flex-direction: column;
  gap: 16px;
}
.bimpro-nav-mobile-link {
  font-size: 18px;
  font-weight: 500;
  color: #cfcece !important;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  transition: color 0.2s;
}
.bimpro-nav-mobile-link:hover { color: #e64317 !important; }
.bimpro-nav-mobile-divider { height: 1px; background: rgba(207,206,206,0.1); margin: 4px 0; }
.bimpro-nav-mobile-bimpro {
  font-size: 18px;
  font-weight: 500;
  color: #e64317 !important;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  display: flex;
  align-items: center;

}
.bimpro-nav-mobile-bimpro:hover { color: #fff !important; }
.bimpro-nav-mobile-call {
  display: block;
  text-align: center;
  padding: 12px 24px 10px;
  background: #e64317;
  color: #fff !important;
  font-family: 'BebasNeueCustom', sans-serif;
  font-size: 22px;
  letter-spacing: 0.05em;
  border-radius: 4px;
  text-decoration: none;
  margin-top: 8px;
  transition: background 0.2s;
}
.bimpro-nav-mobile-call:hover { background: #d13a12; }

@media (max-width: 1024px) {
  .bimpro-nav-links { display: none; }
  .bimpro-nav-hamburger { display: flex; }
}

/* Десктоп: нижний край слова bimpro (нижний край файла логотипа) = нижний край капительных букв меню.
   У ссылок меню есть padding-bottom: 4px под линию hover — без сдвига логотип визуально «ниже» глифов. */

  #allrecords .bimpro-nav img.bimpro-nav-logo {

<script>
(function(){
  var nav = document.querySelector('.bimpro-nav');
  var phone = document.getElementById('bimpro-nav-phone');
  var cta = document.getElementById('bimpro-nav-cta');
  var hamburger = document.getElementById('bimpro-nav-hamburger');
  var mobileMenu = document.getElementById('bimpro-nav-mobile');

  function handleScroll(){
    var scrollY = window.scrollY || window.pageYOffset;
    if(scrollY > 20){
      nav.classList.add('is-scrolled');
    } else {
      nav.classList.remove('is-scrolled');
    }
    var heroBtn = document.getElementById('hero-calc-btn');
    var showCta = false;
    if(heroBtn){
      var rect = heroBtn.getBoundingClientRect();
      showCta = rect.bottom < 80;
    } else {
      showCta = scrollY > 600;
    }
    if(phone && cta){
      if(showCta){
        phone.classList.add('is-hidden');
        cta.classList.add('is-visible');
      } else {
        phone.classList.remove('is-hidden');
        cta.classList.remove('is-visible');
      }
    }
  }
  window.addEventListener('scroll', handleScroll, { passive: true });
  handleScroll();

  if(hamburger && mobileMenu){
    hamburger.addEventListener('click', function(){
      hamburger.classList.toggle('is-open');
      mobileMenu.classList.toggle('is-open');
    });
    // Close mobile menu on link click
    var mobileLinks = mobileMenu.querySelectorAll('a');
    mobileLinks.forEach(function(link){
      link.addEventListener('click', function(){
        hamburger.classList.remove('is-open');
        mobileMenu.classList.remove('is-open');
      });
    });
  }

  // Scroll to top helper
  function bimproScrollPageTop(){
    try{ window.scrollTo({top:0,left:0,behavior:'smooth'}); }catch(x){ window.scrollTo(0,0); }
    var ar=document.getElementById('allrecords');
    if(ar&&ar.scrollTop>0) try{ ar.scrollTo({top:0,behavior:'smooth'}); }catch(x3){ ar.scrollTop=0; }
    var tb=document.querySelector('.t-body');
    if(tb&&tb.scrollTop>0) try{ tb.scrollTo({top:0,behavior:'smooth'}); }catch(x4){ tb.scrollTop=0; }
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest('a');
    if(!a)return;
    var inFooter=a.closest('.t-footer,footer,#t-footer,.t786,.t786__wrapper,.t786__container');
    var in702=a.closest('.t702');
    if(!inFooter&&!in702)return;
    var h=(a.getAttribute('href')||'').trim();
    var voidLink=h==='#'||h==='#top'||h==='javascript:void(0)'||h==='javascript:;'||h==='';
    if(in702&&(voidLink||/наверх/i.test(a.textContent||''))){ e.preventDefault(); bimproScrollPageTop(); return; }
    if(inFooter&&(h==='#'||h==='#top')){ e.preventDefault(); bimproScrollPageTop(); }
  },true);
})();
</script>
