<style>
.bimpro-clients {
  font-family: 'OnestCustom', sans-serif;
  padding: 80px 0;
  background: #1b1b1b;
}
.bimpro-clients-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.bimpro-clients h3 {
  font-family: 'BebasNeueCustom', sans-serif;
  font-size: 36px;
  color: #fff;
  text-align: center;
  margin-bottom: 40px;
}
.bimpro-clients-wrapper {
  position: relative;
  overflow: hidden;
}
.bimpro-clients-wrapper::before,
.bimpro-clients-wrapper::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 80px;
  z-index: 10;
  pointer-events: none;
}
.bimpro-clients-wrapper::before {
  left: 0;
  background: linear-gradient(to right, #1b1b1b, transparent);
}
.bimpro-clients-wrapper::after {
  right: 0;
  background: linear-gradient(to left, #1b1b1b, transparent);
}
.bimpro-clients-track {
  display: flex;
  gap: 16px;
  width: max-content;
  animation: bimpro-marquee 40s linear infinite;
}
.bimpro-clients-track:hover {
  animation-play-state: paused;
}
.bimpro-clients-item {
  width: 200px;
  height: 120px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: #202020;
  border: 1px solid rgba(207,206,206,0.1);
  border-radius: 12px;
  transition: border-color 0.2s, opacity 0.2s;
}
.bimpro-clients-item:hover {
  border-color: rgba(230,67,23,0.5);
  opacity: 1;
}
.bimpro-clients-item img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  opacity: 0.7;
}
.bimpro-clients-item:hover img { opacity: 1; }
@keyframes bimpro-marquee {
