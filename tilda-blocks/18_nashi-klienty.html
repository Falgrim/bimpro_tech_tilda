<style>
.bimpro-clients {
  font-family: 'OnestCustom', sans-serif;
  background: #1b1b1b;
  padding: 0 0 80px;
}
.bimpro-clients-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

.bimpro-clients h3 {
  font-family: 'BebasNeueCustom', sans-serif;
  font-size: 32px;
  color: #fff;
  text-align: center;
  margin-bottom: 40px;
  letter-spacing: 0.03em;
}
.bimpro-marquee-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
}
.bimpro-marquee-fade-l {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 80px;
  background: linear-gradient(to right, #1b1b1b, transparent);
  z-index: 10;
  pointer-events: none;
}
.bimpro-marquee-fade-r {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 80px;
  background: linear-gradient(to left, #1b1b1b, transparent);
  z-index: 10;
  pointer-events: none;
}
.bimpro-marquee-track {
  display: flex;
  width: max-content;
  animation: bimpro-marquee 40s linear infinite;
}
.bimpro-marquee-track:hover { animation-play-state: paused; }
@keyframes bimpro-marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.bimpro-client-item {
  width: 200px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 16px;
  background: #202020;
  border: 1px solid rgba(207,206,206,0.1);
  border-radius: 12px;
  padding: 16px;
  box-sizing: border-box;
  transition: border-color 0.2s;
  flex-shrink: 0;
}
.bimpro-client-item:hover { border-color: rgba(230,67,23,0.5); }
.bimpro-client-item img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.bimpro-client-item:hover img { opacity: 1; }
</style>
