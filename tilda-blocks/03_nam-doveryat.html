<style>
.bimpro-trust {
  font-family: 'OnestCustom', sans-serif;
  padding: 80px 0;
  background: #151515;
  border-bottom: 1px solid rgba(207,206,206,0.1);
  overflow: hidden;
}
.bimpro-trust-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; box-sizing: border-box; }
.bimpro-trust-header { text-align: center; margin-bottom: 48px; }
.bimpro-trust h2 {
  font-family: 'BebasNeueCustom', sans-serif;
  font-size: clamp(28px, 5vw, 36px);
  color: #fff;
  margin-bottom: 8px;
  overflow-wrap: break-word;
  word-break: break-word;
}
.bimpro-trust-sub { color: #cfcece; font-weight: 500; }
.bimpro-trust-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  margin-bottom: 64px;
}
.bimpro-trust-card {
  background: #1b1b1b;
  padding: 32px;
  border-radius: 12px;
  border: 1px solid rgba(207,206,206,0.1);
  text-align: center;
  transition: border-color 0.2s;
}
.bimpro-trust-card:hover { border-color: rgba(230,67,23,0.5); }
.bimpro-trust-avatar {
  width: 128px;
  height: 128px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background: #202020;
  border: 2px solid rgba(230,67,23,0.2);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bimpro-trust-avatar img { width: 100%; height: 100%; object-fit: cover; }
.bimpro-trust-name {
  font-family: 'BebasNeueCustom', sans-serif;
  font-size: 24px;
  color: #fff;
  margin-bottom: 12px;
}
.bimpro-trust-role {
  font-size: 12px;
  color: #cfcece;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.bimpro-trust-awards {
  padding-top: 40px;
  border-top: 1px solid rgba(207,206,206,0.1);
}
.bimpro-trust-awards-title {
  font-size: 12px;
  color: rgba(207,206,206,0.6);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  text-align: center;
  margin-bottom: 32px;
}
.bimpro-trust-awards-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
}
.bimpro-trust-award {
  width: 96px;
  height: 128px;
  border: 2px dashed rgba(207,206,206,0.3);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #202020;
  transition: transform 0.2s, border-color 0.2s;
  cursor: zoom-in;
  position: relative;
  z-index: 5;
  pointer-events: auto;
}
.bimpro-trust-award:hover {
  border-color: #e64317;
  transform: scale(1.05);
}
.bimpro-trust-award img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.bimpro-lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0,0,0,0.95);
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.bimpro-lightbox.is-open { display: flex; }
.bimpro-lightbox-inner {
  position: relative;
  max-width: 90vw;
  max-height: 85vh;
  background: #1a1a1a;
  border: 1px solid rgba(207,206,206,0.2);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
.bimpro-lightbox-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid rgba(207,206,206,0.1);
  background: #202020;
}
.bimpro-lightbox-header h3 { font-family: 'BebasNeueCustom', sans-serif; font-size: 24px; color: #fff; margin: 0; }
.bimpro-lightbox-close {
  width: 40px;
  height: 40px;
  border: none;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
  color: #cfcece;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, color 0.2s;
}
.bimpro-lightbox-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
.bimpro-lightbox-body {
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  background: #151515;
}
.bimpro-lightbox-body img { max-width: 100%; max-height: 70vh; object-fit: contain; }
.bimpro-trust-grid > * { min-width: 0; }

@media (max-width: 768px) {
  .bimpro-trust-grid { grid-template-columns: 1fr; gap: 20px; margin-bottom: 48px; }
  .bimpro-trust { padding: 56px 0; }
  .bimpro-trust-card { padding: 24px; }
  .bimpro-trust-avatar { width: 104px; height: 104px; margin-bottom: 16px; }
  .bimpro-trust-awards { padding-top: 32px; }
  .bimpro-trust-awards-grid { gap: 16px; }
  .bimpro-trust-award { width: 80px; height: 110px; }
  .bimpro-lightbox { padding: 12px; }
  .bimpro-lightbox-inner { max-width: 100%; max-height: 90vh; }
  .bimpro-lightbox-header { padding: 12px 16px; }
  .bimpro-lightbox-header h3 { font-size: 18px; }
  .bimpro-lightbox-body { padding: 16px; min-height: 220px; }
}

@media (max-width: 420px) {
  .bimpro-trust-inner { padding: 0 16px; }
  .bimpro-trust-card { padding: 20px; }
  .bimpro-trust-award { width: calc(50% - 8px); height: auto; aspect-ratio: 96 / 128; }
}
</style>

<div id="bimpro-award-lightbox" class="bimpro-lightbox">

<script>
(function(){
  var lb=document.getElementById('bimpro-award-lightbox');
  var img=document.getElementById('bimpro-award-lightbox-img');
  var grid=document.getElementById('bimpro-awards-grid');
  if(!lb||!img||!grid)return;
  function openAward(src){img.src=src;lb.classList.add('is-open');document.body.style.overflow='hidden';}
  function closeAward(){lb.classList.remove('is-open');document.body.style.overflow='';}
  grid.addEventListener('click',function(e){
    var el=e.target.closest('.bimpro-trust-award');
    if(el){var s=el.getAttribute('data-award-src');if(s){e.preventDefault();e.stopPropagation();openAward(s);}}
  });
  lb.addEventListener('click',function(e){if(e.target===lb)closeAward();});
  lb.querySelector('.bimpro-lightbox-close').addEventListener('click',closeAward);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAward();});
})();
</script>
